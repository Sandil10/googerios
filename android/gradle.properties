org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation breaks when the Pub cache (C:) and the project (F:)
# live on different drives ("this and base files have different roots"). Disable it.
kotlin.incremental=false
org.gradle.caching=false
# Low-RAM machine (~12 GB, little free): keep the build lean and non-persistent.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
