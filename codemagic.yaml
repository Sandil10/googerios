workflows:
  android-release:
    name: Googer Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.35.4
      java: 17
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze || true
      - name: Build APK (release)
        script: flutter build apk --release
      - name: Build AAB (release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt

  ios-testflight:
    name: Googer iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect   # App Store Connect API key integration name (as set in Codemagic)
    environment:
      flutter: 3.35.4
      xcode: latest
      cocoapods: default
      # NOTE: no `ios_signing:` block here on purpose. That block makes Codemagic
      # try to fetch an EXISTING profile at setup time and fails before scripts
      # run. Instead the "Set up code signing" script below CREATES the cert +
      # profile via the API key, then applies them.
      vars:
        APP_STORE_APPLE_ID: 6789272441       # numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze || true
      - name: Set up code signing (fetch/create App Store profile)
        script: |
          # Ensure the bundle id exists on the Developer portal (no-op if it does).
          app-store-connect bundle-ids register "com.googer.ios" \
            --platform IOS || true
          # Ensure an App Store distribution certificate exists (create if missing).
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save || true
          # Create/fetch the App Store provisioning profile for the bundle id.
          app-store-connect fetch-signing-files "com.googer.ios" \
            --type IOS_APP_STORE \
            --create
          # Add fetched certificate(s) to a temporary keychain and apply profiles.
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA (release)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
