workflows:
  android-release:
    name: Googer Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.35.4
      java: 17
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze || true
      - name: Build APK (release)
        script: flutter build apk --release
      - name: Build AAB (release)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt

  ios-testflight:
    name: Googer iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect   # App Store Connect API key integration name (as set in Codemagic)
    environment:
      flutter: 3.35.4
      xcode: latest
      cocoapods: default
      # NOTE: no `ios_signing:` block here on purpose. That block makes Codemagic
      # try to fetch an EXISTING profile at setup time and fails before scripts
      # run. Instead the "Set up code signing" script below CREATES the cert +
      # profile via the API key, then applies them.
      vars:
        APP_STORE_APPLE_ID: 6789272441       # numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze || true
      - name: Set up code signing (fetch cert + profile, load keychain)
        script: |
          set -e
          # 1) Make sure the bundle id exists on the Developer portal.
          app-store-connect bundle-ids create "com.googer.ios" \
            --name "Googer iOS" --platform IOS || true

          # 2) Initialize a temporary keychain for this build.
          keychain initialize

          # 3) Reuse one persistent private key so Codemagic can fetch the same
          #    distribution certificate instead of creating a duplicate every run.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing. Add it in Codemagic environment variables."
            exit 1
          fi
          CERT_KEY=$HOME/cert_key.pem
          printf "%s" "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY"
          chmod 600 "$CERT_KEY"

          # 4) Create/fetch the App Store provisioning profile and matching cert.
          app-store-connect fetch-signing-files "com.googer.ios" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create \
            --verbose

          # 5) Import certificate(s) into the keychain and apply profiles.
          keychain add-certificates
          xcode-project use-profiles

          # 6) Diagnostics: prove a cert + profile actually landed.
          echo "===== signing identities ====="
          security find-identity -v -p codesigning || true
          echo "===== provisioning profiles ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          echo "===== export_options.plist ====="
          cat "$HOME/export_options.plist" 2>/dev/null || echo "NO export_options.plist written"
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA (release)
        script: |
          set -e
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
